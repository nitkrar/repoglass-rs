[package]
name = "repoglass-rs"
version = "0.1.0"
edition = "2024"
description = "Local code and prose index: symbol navigation, lexical and semantic retrieval"
license = "MIT"
repository = "https://github.com/nitkrar/repoglass-rs"

[lib]
name = "repoglass"

[[bin]]
name = "rpg"
path = "src/bin/rpg.rs"

[[bin]]
name = "repoglass"
path = "src/bin/repoglass.rs"

[dependencies]
anyhow = "1.0"
blake2 = "0.11.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
fancy-regex = "0.19.2"
half = "2.7.1"
hex = "0.4.3"
ignore = "0.4.33"
libloading = "0.9.0"
memchr = "2.8.3"
regex = "1.13.1"
# Bundled, so FTS5 and the SQLite version do not depend on the host.
rusqlite = { version = "0.40.2", features = ["bundled"] }
safetensors = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
streaming-iterator = "0.1.9"
tar = "0.4"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
toml = "0.9"
# The runtime Python repoglass 0.3.2 parses with. 0.26.3 and later parse
# some Swift differently.
tree-sitter = "=0.26.2"
ureq = { version = "3", features = ["json"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
